; Rover-base ESP32 firmware (kanga_core_esp32)
;
; Build:  pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Set locally if auto-detect picks the wrong port, e.g. upload_port = /dev/ttyUSB0
lib_deps =
    handmade0octopus/ESP32-TWAI-CAN@^1.0.1
build_flags =
    -Wall
    -I ../../include
