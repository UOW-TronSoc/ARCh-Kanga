services:
  kanga-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        USER_UID: ${KANGA_UID:-1000}
        USER_GID: ${KANGA_GID:-1000}
    image: kanga-dev:humble
    container_name: kanga-dev
    # Default: Docker's bridge network. On Docker Desktop (macOS/Windows/WSL2)
    # real host networking isn't reachable from outside the VM, and this lets
    # kanga-dev share a network with basestation-server for local dev (both
    # land on the same default project network). Native Linux (rover Orin)
    # opts into real host networking via compose.dev.host.yaml.
    ipc: host
    privileged: true
    # SDL-based ROS joy reads /dev/input/event*, which are owned by this host group.
    group_add:
      - "${KANGA_INPUT_GID:-107}"
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Keep one named development runtime alive. docker_shell.bash opens any
    # number of interactive shells in this same container with compose exec.
    command: ["sleep", "infinity"]
    volumes:
      - ..:/workspace
      # Persist libodrive's firmware-specific device descriptor JSON across
      # container recreation.
      - ${KANGA_ODRIVE_CACHE:-${HOME}/.cache/odrivetool}:/home/kanga/.cache/odrivetool
    environment:
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-truecolor}
      - RCUTILS_COLORIZED_OUTPUT=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
