# Runtime behaviour for Kanga's actuator adapter. Physical reduction and motor
# limits are injected from the selected kanga_core_description profile.

wheel_actuator:
  ros__parameters:
    publish_rate_hz: 10.0
    joint_command_timeout_s: 0.5

wheel_joint_state_publisher:
  ros__parameters:
    # Publish stable four-wheel snapshots; ODrive encoder feedback arrives at 100 Hz.
    publish_rate_hz: 50.0
