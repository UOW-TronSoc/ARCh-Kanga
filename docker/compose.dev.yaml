services:
  kanga-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        USER_UID: ${KANGA_UID:-1000}
        USER_GID: ${KANGA_GID:-1000}
    image: kanga-dev:humble
    container_name: kanga-dev
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ..:/workspace
      # Persist libodrive's firmware-specific device descriptor JSON across
      # disposable `docker compose run --rm` development shells.
      - ${KANGA_ODRIVE_CACHE:-${HOME}/.cache/odrivetool}:/home/kanga/.cache/odrivetool
    environment:
      - TERM=xterm-256color
      - COLORTERM=${COLORTERM:-truecolor}
      - RCUTILS_COLORIZED_OUTPUT=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
