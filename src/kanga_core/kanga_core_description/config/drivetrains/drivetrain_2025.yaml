schema_version: 1
profile_id: drivetrain_2025
display_name: "2025 drivetrain design"

# Values inside the groups below are flattened into one shared ROS-parameter
# dictionary. Controller, drive, and joint feedback all receive that same
# dictionary and declare only the parameters they use.
#
# To add an ordinary shared parameter, put it in the most appropriate group.
# The Python loader only needs changing when a new value must be calculated
# from other values, as is done for radius, wheel centres, and joint limit.

drivetrain:
  # Explicit convention: motor revolutions per one wheel-joint revolution.
  motor_revolutions_per_wheel_revolution: 50.0
  motor_velocity_limit_tps: 22.0

wheel_geometry:
  # Store measured primitives here. Do not manually add the derived radius,
  # half_length, half_width, or maximum wheel-joint speed.
  wheel_diameter_m: 0.230
  wheel_width_m: 0.180
  overall_wheel_envelope_length_m: 1.100
  overall_wheel_envelope_width_m: 0.890
  grouser_angle_deg: 51.0

capabilities:
  # Hardware capability only. Whether it is enabled is controller policy.
  limited_holonomic: true
