# Operator / basestation stack: one FastAPI server that joins the ROS 2 graph
# over host networking. Start with ./scripts/basestation_up.bash after a
# workspace build (install/) exists.
#
# The server serves the operator web UI and the API from a single port (8000).
# Dockerfile.basestation-python has a Node 20 stage that builds the React UI.
# The bind mount below overlays host basestation/; basestation_up.bash runs
# scripts/build_frontend.bash (Docker Node 20) so server/static/ on the host
# matches before compose up.
services:
  basestation-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.basestation-python
    image: kanga-basestation-python:humble
    container_name: basestation-server
    restart: unless-stopped
    # Do not use network_mode: host here. On Docker Desktop (macOS/Windows/WSL2)
    # that binds inside the Linux VM, so the host browser cannot reach :8000.
    # Published ports work on those platforms. Native Linux ROS host
    # networking remains available via compose.basestation.host.yaml.
    ports:
      - "8000:8000"
    ipc: host
    working_dir: /workspace/basestation
    volumes:
      - ..:/workspace
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Use UDP instead of shared memory so this container can talk to ROS
      # processes owned by other users. See basestation/fastdds_profile.xml.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/basestation/fastdds_profile.xml
    command:
      [
        "python3",
        "-m",
        "uvicorn",
        "server.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
